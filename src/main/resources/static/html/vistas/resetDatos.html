<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Recuperar datos</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/index.css">
</head>

<body>

    <header>
        <nav class="nav">
            <div class="logo">Sistema Financiero</div>
            <ul class="menu">
                <li><a href="/html/vistas/login.html" class="enlace" id="inicio">Inicio</a></li>
                <li><a href="#" class="enlace" id="contacto">Contáctanos</a></li>
                <li><a href="/html/vistas/login.html" class="enlace" id="login">Iniciar sesion</a></li>
                <li><a href="/html/vistas/register.html" class="enlace" id="register">Registrarme</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Recuperar acceso</h1>
        <p>Selecciona la opción que necesitas</p>

        <div class="options">
            <button class="btn" id="forgot-password">
                Olvidé mi contraseña
            </button>

            <button class="btn" id="forgot-username">
                Olvidé mi usuario
            </button>
        </div>

        <a href="login.html" class="back">Volver al login</a>
    </div>

    <!--OVERLAY PASSWORD-->

    <div id="overlay-password"></div>
    <div id="menu-password" class="hidden-update">
        <h2>Recuperar contraseña</h2>
        <form id="actualizarDatosUsuario">
            <div class="grupo-campos-usuario">

                <label for="email">Correo:</label>
                <input type="email" id="email-pass" name="email" required>

            </div>

            <div class="boton-update">
                <button type="submit">Enviar codigo</button>
            </div>

            <div id="resultadoUpdate" class="resultado"></div>
        </form>
    </div>

    <!--OVERLAY USERNAME-->
    <div id="overlay-username"></div>
    <div id="menu-username" class="hidden-update">
        <h2>Recuperar usuario</h2>
        <form id="actualizarDatosUsuario">
            <div class="grupo-campos-usuario">

                <label for="email">Correo:</label>
                <input type="email" id="email-user" name="email" required>

            </div>

            <div class="boton-update">
                <button type="submit">Enviar codigo</button>
            </div>

            <div id="resultadoUpdate" class="resultado"></div>
        </form>
    </div>

    <footer>
        <p>© 2025 Sistema Financiero</p>
    </footer>

    <script src="/js/reset.js"></script>
</body>

</html>
